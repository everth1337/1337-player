name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Download and update regression tests
        working-directory: base
        run: ./gradlew :app:testDebugUnitTest --tests '*UpdateCheckerTest' --tests '*OfflineDownloaderTest' -Pabis=arm64-v8a
      - name: Extension request-limit regressions
        run: node nexi-youtube/scripts/nexi-rate-limit-test.cjs
      - name: Debug APK
        working-directory: base
        run: ./gradlew :app:assembleDebug -Pabis=arm64-v8a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 1337-player-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 7

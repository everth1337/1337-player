name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.4.7
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Check release version
        run: python3 tools/release_player.py --check-tag "$RELEASE_TAG"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - name: Regression tests
        working-directory: base
        run: ./gradlew :app:testDebugUnitTest --tests '*UpdateCheckerTest' --tests '*OfflineDownloaderTest' -Pabis=arm64-v8a
      - name: Extension request-limit regressions
        run: node nexi-youtube/scripts/nexi-rate-limit-test.cjs
      - name: Restore signing key
        env:
          PLAYER_KEYSTORE_BASE64: ${{ secrets.PLAYER_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('PLAYER_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Set the signing secrets described in docs/RELEASING.md')
          path = Path(os.environ['RUNNER_TEMP']) / 'player-signing.p12'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Signed ARM64 APK
        working-directory: base
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/player-signing.p12
          MYSPOTI_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pabis=arm64-v8a
      - name: Package APK, matching source and checksums
        run: python3 tools/release_player.py --check-tag "$RELEASE_TAG" --package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" build/player-release/*.apk build/player-release/*.zip build/player-release/SHA256SUMS build/player-release/release.json --verify-tag --draft --title "1337 Player ${RELEASE_TAG#v}" --notes-file build/player-release/notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/player-signing.p12"
